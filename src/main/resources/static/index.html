<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#355b43" />
    <title>Тихий двір — керування готелями</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- The module entry point owns navigation; no inline scripts are needed. -->
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="app"><p class="loading">Завантажуємо робочий простір…</p></div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <!-- One shared native dialog hosts the resource forms. -->
    <dialog id="modal">
      <div class="dialog-top">
        <h2 id="modal-title"></h2>
        <button id="close-modal" class="icon-button" aria-label="Закрити">
          ×
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
