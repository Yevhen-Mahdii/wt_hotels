><text x="306.006" y="500.791" fill="#000" font-size="12" textLength="237.387">Відхилити невідповідне бронювання;</text><text x="306.006" y="514.76" fill="#000" font-size="12" textLength="139.078">відкотити транзакцію</text><ellipse cx="424.699" cy="560.199" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="424.699" cy="560.199" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="728.105,444.043,937.722,444.043,949.722,456.043,937.722,468.043,728.105,468.043,716.105,456.043,728.105,444.043" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="728.105" y="459.851" fill="#000" font-size="11" textLength="209.618">Є активне бронювання на сьогодні?</text><text x="696.312" y="453.449" fill="#000" font-size="11" textLength="19.792">так</text><text x="949.722" y="453.449" fill="#000" font-size="11" textLength="10.248">ні</text><rect x="593.393" y="478.043" width="218.129" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="603.393" y="499.182" fill="#000" font-size="12" textLength="198.129">Відхилити: потрібне заселення</text><text x="603.393" y="513.15" fill="#000" font-size="12" textLength="185.35">за відповідним бронюванням</text><ellipse cx="702.457" cy="558.59" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="702.457" cy="558.59" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="831.521" y="478.043" width="263.697" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="841.521" y="499.182" fill="#000" font-size="12" textLength="243.697">Дозволити заселення без бронювання</text><polygon points="559.132,581.199,571.132,593.199,559.132,605.199,547.132,593.199,559.132,581.199" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="422.116" y="625.199" width="274.033" height="4