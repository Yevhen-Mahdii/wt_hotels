<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#355b43" />
    <title>Мої номери — Тихий двір</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- Each page loads only its controller, which initializes the shared session and UI. -->
    <script type="module" src="/js/pages/rooms.js"></script>
  </head>
  <body data-page="rooms">
    <p id="page-status" class="loading" role="status">
      Завантажуємо робочий простір…
    </p>
    <div class="shell" hidden>
      <main id="main">
        <div class="page-head">
          <div>
            <div class="eyebrow" data-role-caption></div>
            <h1>Мої номери</h1>
            <p id="page-description">Щоденна робота готелю</p>
          </div>
          <button id="add-room">+ Номер</button>
        </div>
        <div id="items" class="grid"></div>
        <p id="empty" class="empty" hidden>
          Додайте номер, зазначте кількість ліжок, оснащення та ціну.
        </p>
      </main>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <noscript>Для роботи застосунку увімкніть JavaScript.</noscript>
  </body>
</html>
