spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/hotels;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DB_PASSWORD:}
  # Flyway owns schema changes; Hibernate validates mappings instead of modifying tables.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  zone: Europe/Kyiv
  jwt-key-file: ${JWT_KEY_FILE:./data/jwt.key}
