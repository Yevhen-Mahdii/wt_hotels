очі = max(1, різниця облікових дат);</text><text x="62.196" y="554.295" fill="#000" font-size="12" textLength="215.813">Дохід = ціна при заселенні × ночі</text><rect x="16" y="587.125" width="332.621" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="26" y="608.264" fill="#000" font-size="12" textLength="312.621">Створити єдиний запис доходу для проживання;</text><text x="26" y="622.232" fill="#000" font-size="12" textLength="179.689">час доходу = час виселення</text><rect x="53.676" y="703.465" width="257.27" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="63.676" y="724.604" fill="#000" font-size="12" textLength="237.27">Перевести бронювання у COMPLETED</text><polygon points="107.934,655.063,256.687,655.063,268.687,667.063,256.687,679.063,107.934,679.063,95.934,667.063,107.934,655.063" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="186.311" y="689.273" fill="#000" font-size="11" textLength="19.792">так</text><text x="107.934" y="670.871" fill="#000" font-size="11" textLength="148.752">Є пов’язане бронювання?</text><polygon points="182.311,757.434,194.311,769.434,182.311,781.434,170.311,769.434,182.311,757.434" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="76.949" y="801.434" width="210.723" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="86.949" y="822.572" fill="#000" font-size="12" textLength="190.723">Перевести номер у CLEANING;</text><text x="86.949" y="836.541" fill="#000" font-size="12" textLength="178.096">зафіксувати всі зміни разом</text><rect x="63.947" y="869.371" width="236.727" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="73.947" y="890.51" fill="#000" font-size="12" textLength="181.225">Після прибирання Керуючий</text><text x="73.947" y="