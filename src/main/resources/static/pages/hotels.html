<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#355b43" />
    <title>Готелі мережі — Тихий двір</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- Each page loads only its controller, which initializes the shared session and UI. -->
    <script type="module" src="/js/pages/hotels.js"></script>
  </head>

  <body data-page="hotels">
    <p id="page-status" class="loading" role="status">Завантажуємо робочий простір…</p>
    <div class="shell" hidden>
      <main id="main">
        <div class="page-head">
          <div>
            <div class="eyebrow" data-role-caption></div>
            <h1>Готелі мережі</h1>
            <p id="page-description">
              Створюйте готелі та призначайте Керуючих у розділі користувачів.
            </p>
          </div>
          <button id="add-hotel">+ Готель</button>
        </div>
        <div id="items" class="grid"></div>
        <p id="empty" class="empty" hidden>Почніть із першого готелю мережі.</p>
      </main>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <noscript>Для роботи застосунку увімкніть JavaScript.</noscript>
  </body>
</html>
