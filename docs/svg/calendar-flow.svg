<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:662px;height:1149px;background:#FAF9F3;" width="662px" height="1149px" viewBox="0 0 662 1149" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="662" height="1149" fill="#FAF9F3" style="stroke:none;"/><g class="title" data-source-line="1"><text x="159.385" y="32.995" fill="#000" font-size="14" textLength="341.298" font-weight="700">Формування календаря і накладки станів</text></g><ellipse cx="198.616" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="73.444" y="92.297" width="250.344" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="83.444" y="113.436" fill="#000" font-size="12" textLength="200.104">Перевірити період (1-366 днів);</text><text x="83.444" y="127.404" fill="#000" font-size="12" textLength="230.344">обмежити Керуючого своїм готелем</text><rect x="43.614" y="160.234" width="310.004" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="53.614" y="181.373" fill="#000" font-size="12" textLength="290.004">Завантажити номери, RESERVED-бронювання</text><text x="53.614" y="195.342" fill="#000" font-size="12" textLength="165.633">і проживання для періоду</text><rect x="75.964" y="228.172" width="245.305" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="85.964" y="249.311" fill="#000" font-size="12" textLength="174.123">Для кожного номера і дати</text><text x="85.964" y="263.279" fill="#000" font-size="12" textLength="225.305">почати з порожнього списку станів</text><rect x="73.696" y="344.512" width="249.84" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="83.696" y="365.65" fill="#000" font-size="12" textLength="229.84">Додати RESERVED та id бронювання</text><polygon points="99.96,296.109,297.272,296.109,309.272,308.109,297.272,320.109,99.96,320.109,87.96,308.109,99.96,296.109" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="202.616" y="330.32" fill="#000" font-size="11" textLength="19.792">так</text><text x="99.96" y="311.917" fill="#000" font-size="11" textLength="197.313">Дата у [заїзд, виїзд) бронювання?</text><polygon points="198.616,398.48,210.616,410.48,198.616,422.48,186.616,410.48,198.616,398.48" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="131.839" y="490.883" width="133.555" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="141.839" y="512.021" fill="#000" font-size="12" textLength="113.555">Додати OCCUPIED</text><polygon points="87.547,442.48,309.685,442.48,321.685,454.48,309.685,466.48,87.547,466.48,75.547,454.48,87.547,442.48" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="202.616" y="476.691" fill="#000" font-size="11" textLength="19.792">так</text><text x="87.547" y="458.289" fill="#000" font-size="11" textLength="222.138">Фактичне проживання охоплює дату?</text><polygon points="198.616,544.852,210.616,556.852,198.616,568.852,186.616,556.852,198.616,544.852" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="132.308" y="637.254" width="132.617" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="142.308" y="658.393" fill="#000" font-size="12" textLength="112.617">Додати CLEANING</text><polygon points="108.47,588.852,288.762,588.852,300.762,600.852,288.762,612.852,108.47,612.852,96.47,600.852,108.47,588.852" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="202.616" y="623.062" fill="#000" font-size="11" textLength="19.792">так</text><text x="108.47" y="604.66" fill="#000" font-size="11" textLength="180.292">Це сьогодні і номер CLEANING?</text><polygon points="198.616,691.223,210.616,703.223,198.616,715.223,186.616,703.223,198.616,691.223" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="147.929" y="783.625" width="101.375" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="157.929" y="804.764" fill="#000" font-size="12" textLength="81.375">Додати FREE</text><polygon points="145.757,735.223,251.476,735.223,263.476,747.223,251.476,759.223,145.757,759.223,133.757,747.223,145.757,735.223" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="202.616" y="769.433" fill="#000" font-size="11" textLength="19.792">так</text><text x="145.757" y="751.031" fill="#000" font-size="11" textLength="105.719">Список порожній?</text><polygon points="198.616,837.594,210.616,849.594,198.616,861.594,186.616,849.594,198.616,837.594" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="132.944,881.594,264.289,881.594,276.289,893.594,264.289,905.594,132.944,905.594,120.944,893.594,132.944,881.594" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="132.944" y="897.402" fill="#000" font-size="11" textLength="131.345">Станів більше одного?</text><text x="101.151" y="891" fill="#000" font-size="11" textLength="19.792">так</text><text x="276.289" y="891" fill="#000" font-size="11" textLength="10.248">ні</text><rect x="16" y="915.594" width="181.092" height="47.938" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="26" y="936.732" fill="#000" font-size="12" textLength="135.598">Позначити накладку;</text><text x="26" y="950.701" fill="#000" font-size="12" textLength="161.092">показати всі стани разом</text><rect x="217.092" y="915.594" width="147.189" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="227.092" y="936.732" fill="#000" font-size="12" textLength="127.189">Показати один стан</text><polygon points="198.616,969.531,210.616,981.531,198.616,993.531,186.616,981.531,198.616,969.531" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="97.632" y="1013.531" width="201.969" height="33.969" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="107.632" y="1034.67" fill="#000" font-size="12" textLength="181.969">Повернути рядки календаря</text><path d="M229.616,1057.5 L229.616,1088.766 L209.616,1092.766 L229.616,1096.766 L229.616,1128.031 A0,0 0 0 0 229.616,1128.031 L641.067,1128.031 A0,0 0 0 0 641.067,1128.031 L641.067,1067.5 L631.067,1057.5 L229.616,1057.5 A0,0 0 0 0 229.616,1057.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M631.067,1057.5 L631.067,1067.5 L641.067,1067.5 L631.067,1057.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="235.616" y="1074.567" fill="#000" font-size="13" textLength="390.451">Відкрите проживання показується до сьогодні включно,</text><text x="235.616" y="1089.7" fill="#000" font-size="13" textLength="309.277">без прогнозу його майбутнього завершення.</text><text x="235.616" y="1104.833" fill="#000" font-size="13" textLength="272.035">Клінінг показується тільки на сьогодні.</text><text x="235.616" y="1119.965" fill="#000" font-size="13" textLength="380.244">Майбутній FREE не гарантує завершеного прибирання.</text><ellipse cx="198.616" cy="1092.766" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="198.616" cy="1092.766" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="198.616" y1="72.297" x2="198.616" y2="92.297" style="stroke:#70553F;stroke-