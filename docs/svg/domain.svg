40.853" fill="#000" font-size="14" textLength="145.681">Статус бронювання</text></g><!--class Stay--><g class="entity" data-qualified-name="Stay" id="ent0006" data-source-line="36"><rect x="294.93" y="525.147" width="343.83" height="83.188" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="420.221" y="543.142" fill="#000" font-size="14" textLength="93.249">Проживання</text><line x1="295.93" y1="551.444" x2="637.76" y2="551.444" style="stroke:#181818;stroke-width:0.5;"/><text x="300.93" y="568.439" fill="#000" font-size="14" textLength="192.035">Фактичний час заселення</text><text x="300.93" y="584.736" fill="#000" font-size="14" textLength="331.83">Фактичний час виселення — необов’язковий</text><text x="300.93" y="601.033" fill="#000" font-size="14" textLength="286.925">Ціна за ніч, зафіксована при заселенні</text></g><!--class Revenue--><g class="entity" data-qualified-name="Revenue" id="ent0007" data-source-line="41"><rect x="595.46" y="685.337" width="204.773" height="83.188" fill="#E4EDDC" style="stroke:#181818;stroke-width:0.5;" rx="6" ry="6"/><text x="611.574" y="703.332" fill="#000" font-size="14" textLength="172.546">Запис валового доходу</text><line x1="596.46" y1="711.634" x2="799.233" y2="711.634" style="stroke:#181818;stroke-width:0.5;"/><text x="601.46" y="728.629" fill="#000" font-size="14" textLength="108.274">Час виселення</text><text x="601.46" y="744.926" fill="#000" font-size="14" textLength="192.773">Кількість облікових ночей</text><text x="601.46" y="761.223" fill="#000" font-size="14" textLength="37.201">Сума</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="55"><path d="M157.04,216.807 L157.04,242.077 L122.12,246.077 L157.04,250.077 L157.04,275.338 A6,6 0 0 0 163.04,281.338 L448.639,281.338 A6,6 0 0 0 454.639,275.338 L454.639,220.807 L444.639,210.807 L163.04,210.807 A6,6 0 0 0 157.04,216.807" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M444.639,210.807 L444.639,217.807 A3,3 0 0 0 447.639,220.807 L454.639,220.807 L444.639,210.807" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="163.04" y="227.874" fill="#000" font-size="13" textLength="225.278">Один користувач має одну роль.</text><text x="163.04" y="243.007" fill="#000" font-size="13" textLength="276.599">Керуючий обов’язково має один готель;</text><text x="163.04" y="258.139" fill="#000" font-size="13" textLength="235.39">інші ролі не прив’язані до готелю.</text><text x="163.04" y="273.272" fill="#000" font-size="13" textLength="258.223">Готель може мати кількох Керуючих.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="61"><path d="M520.32,377.297 L520.32,435.828 A6,6 0 0 0 526.32,441.828 L853.363,441.828 A6,6 0 0 0 859.363,435.828 L859.363,381.297 L849.363,371.297 L669.66,371.297 L618.92,304.287 L661.66,371.297 L526.32,371.297 A6,6 0 0 0 520.32,377.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M849.363,371.297 L849.363,378.297 A3,3 0 0 0 852.363,381.297 L859.363,381.297 L849.363,371.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="526.32" y="388.364" fill="#000" font-size="13" textLength="235.619">Оснащення: чайник, кондиціонер,</text><text x="526.32" y="403.497" fill="#000" font-size="13" textLength="168.784">телевізор, холодильник.</text><text x="526.32" y="418.629" fill="#000" font-size="13" textLength="318.043">Бронювання не змінює фізичний стан номера.</text><text x="526.32" y="433.762" fill="#000" font-size="13" textLength="199.945">Дані гостей не зберігаються.</text></g><!--link Role to User--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="46" data-link-type="association"><path d="M71.84,111.597 C71.84,140.757 71.84,183.137 71.84,212.277" style="stroke:#70553F;stroke-width:1;" fill="none" id="Role-User" codeLine="46"/><text x="72.84" y="154.254" fill="#000" font-size="13" textLength="80.723">призначена</text><te